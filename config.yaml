# Paths are relative to this file.
dataset:
  repo_id: aleperez24/sureon
  parquet_dir: data

videos:
  base_dir: ./videos
  cookies_file: my_cookies.txt  # Path to YouTube cookies.txt.

curation:
  model_dir: ./nonsurgical_object_detection
  preblurred_dir: .cache/preblurred
  ocr_gpu: true

